/* ⭐ 2026-09-03: Capacitor 6 → 8 업그레이드.
   Play Console 두 오류(targetSdk 34→36 필수, Play Billing Library 7.1.1→8.0.0+ 필수)를
   해결하려고 올렸다 — RevenueCat 플러그인의 최신 버전(Billing 8.x 포함)이 Capacitor 8을

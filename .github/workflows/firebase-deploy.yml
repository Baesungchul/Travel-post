# Firebase 자동 배포 — push 하면 실제 서비스에 반영된다.
#
#   ① 규칙 + 공개페이지 (항상 실행 · 권한 가벼움)
#      · firestore.rules / storage.rules
#      · hosting(www/site) → privacy.html · delete.html · post.html(PC 링크)
#   ② 함수 (실패해도 전체를 빨갛게 만들지 않음 · 권한 많이 탐)
#      · aiProxy(AI 글쓰기) · cleanupSnsPosts · deleteUserData
#      함수는 자주 바뀌지 않으므로, 권한이 안 맞으면 PC 에서 아래 한 줄로 배포하면 된다.
#         npx firebase-tools deploy --only functions
#
#   ⚠️ 필요한 것: 저장소 시크릿 FIREBASE_SERVICE_ACCOUNT (서비스 계정 JSON 전체)
#      https://github.com/Baesungchul/Travel-post/settings/secrets/actions
#      시크릿이 없으면 조용히 건너뛴다.
#
#   ⚠️ ANTHROPIC_API_KEY 는 여기 두지 않는다. Google Secret Manager 에 이미 있고
#      functions/index.js 가 defineSecret 으로 가져다 쓴다.

name: Firebase 배포

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 시크릿 확인
        id: check
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT 시크릿이 아직 없어 배포를 건너뜁니다."
            echo "등록하는 곳: https://github.com/Baesungchul/Travel-post/settings/secrets/actions"
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          fi

      - name: 규칙 + 공개페이지 배포
        if: steps.check.outputs.have == 'yes'
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,storage,hosting \
            --project travel-post-52713 \
            --non-interactive --force
          echo "공개 페이지: https://travel-post-52713.web.app/"

      - name: 함수 배포 (실패해도 계속)
        if: steps.check.outputs.have == 'yes'
        continue-on-error: true
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install --prefix functions --no-audit --no-fund
          if ! npx --yes firebase-tools@latest deploy \
                 --only functions \
                 --project travel-post-52713 \
                 --non-interactive --force; then
            echo "::warning::함수 배포 실패 — 대개 서비스 계정 권한 문제입니다."
            echo "  방법 1) PC 에서: npx firebase-tools deploy --only functions"
            echo "  방법 2) Google Cloud 콘솔 → IAM → 이 서비스 계정에 역할 추가:"
            echo "          Cloud Functions 관리자 / 서비스 계정 사용자 /"
            echo "          Artifact Registry 관리자 / Cloud Build 편집자 /"
            echo "          Secret Manager 보안 비밀 접근자"
            exit 1
          fi

      - name: 임시 키 파일 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

# Firebase 자동 배포 — push 하면 실제 서비스에 반영된다.
#
#   단계를 쪼개 둔 이유: 서비스 계정 권한이 항목마다 다르게 필요해서,
#   하나가 막혀도 나머지는 배포되게 하기 위함이다.
#     ① 공개페이지(hosting)  — 권한 가벼움. 여기가 핵심(개인정보처리방침·PC링크 주소)
#     ② firestore 규칙       — 실패해도 계속
#     ③ storage 규칙         — 실패해도 계속
#     ④ functions            — 실패해도 계속 (권한을 가장 많이 탐)
#
#   ②③④ 가 "Permission denied to get service" 로 실패하면,
#   Google Cloud 콘솔 → IAM 에서 이 서비스 계정에 아래 역할을 추가하면 된다:
#     · Service Usage 소비자 (roles/serviceusage.serviceUsageConsumer)   ← ②③ 해결
#     · Cloud Functions 관리자 / 서비스 계정 사용자 /
#       Artifact Registry 관리자 / Cloud Build 편집자 /
#       Secret Manager 보안 비밀 접근자                                   ← ④ 해결
#   급하지 않으면 PC 에서 아래 한 줄로 해도 된다 (규칙·함수는 자주 안 바뀜):
#     npx firebase-tools deploy --only firestore:rules,storage,functions
#
#   ⚠️ 필요한 것: 저장소 시크릿 FIREBASE_SERVICE_ACCOUNT (서비스 계정 JSON 전체)
#   ⚠️ ANTHROPIC_API_KEY 는 여기 두지 않는다. Google Secret Manager 에 이미 있다.
#
#   ⭐ 2026-09-03 추가 — REVENUECAT_WEBHOOK_SECRET (저장소 시크릿, 선택):
#      functions/index.js 의 revenuecatWebhook 이 defineSecret 으로 이 이름을 쓴다.
#      Secret Manager 에 이 시크릿의 값이 **한 번도** 설정된 적이 없으면(=처음 이 함수를
#      배포하는 시점) firebase-tools 가 "④ 함수 배포" 단계 전체를 실패시킨다(그 함수 하나만이
#      아니라 이미 잘 돌던 aiProxy 등 다른 함수들도 이번 배포에서는 반영이 안 된다 — 값이
#      없어도 이전에 배포된 함수는 그대로 살아있으니 서비스가 끊기진 않는다).
#      → 아래 "④-0" 단계가 저장소 시크릿 REVENUECAT_WEBHOOK_SECRET 을 Secret Manager 로
#        동기화해서 이 문제를 막는다. 값이 아직 없으면 조용히 건너뛰고(RevenueCat 웹훅은
#        아직 안 씀) 경고만 남긴다 — 저장소 시크릿을 넣으면 다음 배포부터 자동으로 반영된다.

name: Firebase 배포

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

env:
  FB_PROJECT: travel-post-52713

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 시크릿 확인
        id: check
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 배포를 건너뜁니다."
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          fi

      # ① 핵심 — 공개 페이지. 여기가 실패하면 진짜 문제다.
      - name: ① 공개페이지 배포 (hosting)
        if: steps.check.outputs.have == 'yes'
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting \
            --project "$FB_PROJECT" --non-interactive --force
          echo "✅ https://$FB_PROJECT.web.app/privacy.html"
          echo "✅ https://$FB_PROJECT.web.app/delete.html"
          echo "✅ https://$FB_PROJECT.web.app/post.html"

      - name: ② firestore 규칙 배포
        if: steps.check.outputs.have == 'yes'
        continue-on-error: true
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only firestore:rules \
            --project "$FB_PROJECT" --non-interactive --force

      - name: ③ storage 규칙 배포
        if: steps.check.outputs.have == 'yes'
        continue-on-error: true
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only storage \
            --project "$FB_PROJECT" --non-interactive --force

      - name: ④-0 RevenueCat 웹훅 시크릿 동기화 (저장소 → Secret Manager)
        if: steps.check.outputs.have == 'yes'
        continue-on-error: true
        env:
          RC_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if [ -z "$RC_SECRET" ]; then
            echo "::warning::REVENUECAT_WEBHOOK_SECRET 저장소 시크릿이 없어 건너뜁니다 — RevenueCat 웹훅은 아직 못 켭니다."
          else
            printf '%s' "$RC_SECRET" | npx --yes firebase-tools@latest functions:secrets:set REVENUECAT_WEBHOOK_SECRET \
              --project "$FB_PROJECT" --data-file - --force
          fi

      - name: ④ 함수 배포
        if: steps.check.outputs.have == 'yes'
        continue-on-error: true
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install --prefix functions --no-audit --no-fund
          npx --yes firebase-tools@latest deploy --only functions \
            --project "$FB_PROJECT" --non-interactive --force

      - name: 임시 키 파일 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
